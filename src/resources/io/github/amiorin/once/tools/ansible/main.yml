---
- name: Managed Server Configuration
  hosts: all
  tasks:
    - name: Install docker
      ansible.builtin.shell: >-
        curl -fsSL https://get.docker.com -o install-docker.sh
        && sudo sh install-docker.sh
        && rm install-docker.sh
      args:
        creates: /usr/bin/docker
      register: docker_install_result
      until: docker_install_result.rc == 0
      retries: 10
      delay: 10

    - name: Install ONCE
      ansible.builtin.shell: >-
        curl https://get.once.com | ONCE_INTERACTIVE=false sh
      args:
        creates: /usr/local/bin/once
      register: once_install_result
      until: once_install_result.rc == 0
      retries: 10
      delay: 10

    - name: Copy .mailrc
      ansible.builtin.copy:
        src: ../tofu-smtp/mailrc
        dest: .mailrc
        mode: "0600"

    - name: Update cache and install s-nail
      apt:
        name: s-nail
        state: present
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Install babashka
      ansible.builtin.shell: >-
        curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
        && chmod +x install
        && sudo ./install
        && rm install
      args:
        creates: /usr/local/bin/bb
      register: bb_install_result
      until: bb_install_result.rc == 0
      retries: 10
      delay: 10

    - name: Reconcile ONCE applications
      become: yes
      once_run:
        applications:
          - host: "www.bigconfig.online"
            image: "ghcr.io/amiorin/big-config-website"
