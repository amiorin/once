name: Test and Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Runs tests
        id: run_tests
        run: devenv shell -- bash -c "npm ci && npm test"

  tag:
    needs: test
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create and push tag
        run: |
          count=$(git rev-list --count HEAD)
          tag="1.0.${count}"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')
          if [ -n "$remote_sha" ] && [ "$remote_sha" = "$local_sha" ]; then
            echo "Tag ${tag} already at ${local_sha}, skipping"
            exit 0
          fi
          git tag -f "$tag"
          git push --force origin "$tag"
