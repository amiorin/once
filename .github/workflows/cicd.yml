name: Test, Parity, and Tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Green tests
        run: devenv shell bash -lc 'cd green && clojure -X:test'
      - name: Red tests and typecheck
        run: devenv shell bash -lc 'cd red && bun install && bun test && bun run typecheck'
      - name: Blue tests
        run: devenv shell bash -lc 'cd blue && uv sync && uv run python -m pytest -q'
      - name: Byte parity
        run: devenv shell ./scripts/parity.sh
      - name: Launcher resolution
        run: devenv shell ./scripts/launcher.sh

  tag:
    needs: test
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create and push tag
        run: |
          count=$(git rev-list --count HEAD)
          tag="1.0.${count}"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')
          if [ -n "$remote_sha" ] && [ "$remote_sha" = "$local_sha" ]; then
            echo "Tag ${tag} already at ${local_sha}, skipping"
            exit 0
          fi
          git tag -f "$tag"
          git push --force origin "$tag"
