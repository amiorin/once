[project]
name = "once"
version = "1.0.0"
description = "Automated provisioning and configuration of cloud infrastructure with OpenTofu and Ansible."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "big-config @ file:///home/ubuntu/code/bigconfig/big-config/python",
]

[project.scripts]
once = "once.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/once"]
force-include = { "src/resources" = "src/resources" }

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
